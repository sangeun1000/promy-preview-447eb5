<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>프로미 광장 · 프로미 월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Paperlogy';font-weight:700;font-display:swap;src:local('Paperlogy 7 Bold'),local('Paperlogy-7Bold'),url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-display:swap;src:local('Paperlogy 8 ExtraBold'),local('Paperlogy-8ExtraBold'),url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2')}
:root{--cream:#FFF6E0;--line:#E8D2A0;--ink:#5A4636;--green:#5DB36B;--orange:#F2994A;--pink:#F28B9B;--sky:#7FD3E8;
 --f:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaf4;font-family:var(--f);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.nm{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:13px;font-weight:700;background:rgba(255,246,224,.92);border:2px solid var(--line);border-radius:12px;padding:1px 8px;white-space:nowrap;color:var(--ink);will-change:transform}
.nm.me{background:#FFE9A8;border-color:#F0B84A}
.nm.lamp{background:#FFF3C4;font-size:12px}
.bub{position:absolute;left:0;top:0;max-width:230px;min-width:60px;font-size:14px;line-height:1.35;background:#fff;border:3px solid var(--line);border-radius:16px;padding:7px 11px;color:var(--ink);will-change:transform;box-shadow:0 3px 0 rgba(120,90,50,.18)}
.bub::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-8px;border:8px solid transparent;border-top:10px solid var(--line);border-bottom:0}
.bub::before{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top:8px solid #fff;border-bottom:0;z-index:2}
.bub.promy{background:#FFFBEA;border-color:#F0B84A;font-size:15px;max-width:260px}
.bub.promy::after{border-top-color:#F0B84A}.bub.promy::before{border-top-color:#FFFBEA}
.panel{background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 rgba(150,110,60,.22)}
#mission{position:fixed;left:12px;top:12px;width:min(310px,46vw);padding:10px 14px 12px}
#mission .k{font-size:12px;color:#fff;background:var(--green);display:inline-block;border-radius:10px;padding:1px 9px;margin-bottom:4px}
#mission h3{font-family:'Paperlogy',var(--f);font-weight:700;margin:0 0 4px;font-size:17px;line-height:1.25}
#mission .row{font-size:13px;line-height:1.35;margin-top:2px}
#mission .row b{color:var(--orange)}
#mission .bar{height:10px;border-radius:6px;background:#EBDDB8;margin-top:7px;overflow:hidden}
#mission .bar i{display:block;height:100%;background:linear-gradient(90deg,#8FD16A,#5DB36B);border-radius:6px;transition:width .5s}
#mission .dist{float:right;font-size:12px;color:#9a8566}
#stats{position:fixed;right:12px;top:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:min(250px,40vw)}
#stats .g{font-size:16px}
#stats .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:1px 8px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.stamp i{background:#E8636B}.chip.lamp i{background:#FFC93C}.chip.warm i{background:#F2994A}.chip.deco i{background:#B79BE6}
.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.btn{font-family:var(--f);font-size:14px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px 12px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(150,110,60,.2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.go{background:var(--green);border-color:#4B9A58;color:#fff}
.btn.pk{background:var(--pink);border-color:#d9707f;color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
#gauge{position:fixed;left:50%;top:12px;transform:translateX(-50%);width:min(380px,32vw);padding:6px 14px 8px;text-align:center}
#gauge .t{font-size:14px}#gauge .t b{font-size:16px;color:var(--green)}
#gauge .bar{height:8px;border-radius:5px;background:#EBDDB8;margin-top:4px;overflow:hidden}
#gauge .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F7B8CC,#F28B9B);transition:width .6s}
#gauge .s{font-size:11px;color:#9a8566;margin-top:2px}
#zone{position:fixed;left:50%;top:84px;transform:translateX(-50%) scale(.8);font-family:'Paperlogy',var(--f);font-weight:800;font-size:34px;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(90,70,54,.55),0 0 14px rgba(90,70,54,.35);opacity:0;transition:opacity .45s,transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:15;white-space:nowrap}#zone.on{opacity:1;transform:translateX(-50%) scale(1)}
#prompt{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) scale(.9);padding:7px 18px;font-size:17px;opacity:0;transition:.18s;pointer-events:none;white-space:nowrap}
#prompt.on{opacity:1;transform:translateX(-50%) scale(1)}
#prompt kbd{background:var(--green);color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;font-family:var(--f)}
#strip{position:fixed;left:50%;bottom:126px;transform:translateX(-50%);width:min(860px,94vw);padding:10px 12px;display:none}
#strip.on{display:block;animation:rise .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateX(-50%) translateY(30px) scale(.9);opacity:0}}
#strip .hd{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#strip .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.card{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 10px 8px;font-size:13px;line-height:1.35;position:relative}
.card.paper{background:#FFF4B8;border-color:#E9CE6A;transform:rotate(-1deg)}
.card.paper:nth-child(2n){background:#FFE0E8;border-color:#F0B8C8;transform:rotate(1deg)}
.card.paper:nth-child(3n){background:#DDF3FF;border-color:#A9D8EE}
.card .who{font-size:12px;color:#8a7352}
.card .btn{margin-top:5px;padding:2px 10px;font-size:13px}
#strip .ft{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 14px;font-size:15px;animation:tin .4s cubic-bezier(.3,1.6,.5,1);display:flex;gap:8px;align-items:center}
.toast img{height:36px}
@keyframes tin{from{transform:translateY(-14px) scale(.7);opacity:0}}
#reward{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(90,70,54,.18);z-index:30}
#reward.on{display:flex}
#reward .box{width:min(430px,92vw);text-align:center;padding:16px 18px 18px;animation:rise2 .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes rise2{from{transform:scale(.5);opacity:0}}
#reward img{height:120px;margin-top:-62px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
#reward h2{font-family:'Paperlogy',var(--f);font-weight:800;margin:2px 0 2px;font-size:25px;color:var(--green)}#reward .mn{font-size:15px;margin-bottom:8px}
#reward .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
#reward .chips .chip{font-size:18px;padding:4px 12px;animation:chipin .6s cubic-bezier(.3,1.9,.5,1) both}
@keyframes chipin{from{transform:translateY(40px) scale(.2);opacity:0}}
#reward .say{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-size:15px;min-height:50px;line-height:1.4}
#reward .nx{font-size:13px;color:#9a8566;margin:8px 0 6px}
.over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(90,70,54,.25);z-index:40}
.over.on{display:flex}
.over .box{width:min(520px,94vw);max-height:92vh;overflow:auto;padding:16px 18px;animation:rise2 .45s cubic-bezier(.3,1.6,.5,1)}
.over h2{font-family:'Paperlogy',var(--f);font-weight:800;margin:0 0 4px;font-size:23px}
.over .sub{font-size:14px;color:#8a7352;margin-bottom:8px}
.over label{display:block;font-size:14px;margin:9px 0 4px}
.over input[type=text]{font-family:var(--f);font-size:16px;width:100%;border:3px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.chs .btn.sel{background:var(--green);border-color:#4B9A58;color:#fff}
.prev{margin-top:10px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:17px;text-align:center}
.over .x{float:right}
.promy-h{display:flex;gap:10px;align-items:flex-end}.promy-h img{height:84px}
.nb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nb .cell{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-size:13px}.nb .cell b{display:block;font-size:20px;color:var(--green)}
.stampgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:6px 0}
.stampgrid i{aspect-ratio:1;border-radius:50%;border:2px dashed #d9c694;display:block}.stampgrid i.on{border:2px solid #E8636B;background:#FDE3E4;position:relative}.stampgrid i.on::after{content:"✓";color:#E8636B;position:absolute;inset:0;text-align:center;font-size:14px;line-height:22px}
#travel{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);display:none;padding:12px 16px;text-align:center;z-index:25}
#travel.on{display:block;animation:rise .3s cubic-bezier(.3,1.5,.5,1)}
#travel .b{display:flex;gap:8px;justify-content:center;margin-top:8px}
#minimap{position:fixed;right:12px;top:128px;display:none;padding:6px}
#minimap.on{display:block}#minimap canvas{display:block;width:230px;height:150px;border-radius:12px}
#minimap .n{font-size:11px;color:#8a7352;text-align:center;margin-top:2px}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;background:rgba(255,246,224,.9);border:2px solid var(--line);border-radius:14px;padding:3px 12px;transition:opacity 1s;white-space:nowrap}
#joy{position:fixed;left:22px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,246,224,.55);border:3px solid rgba(232,210,160,.9);display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--line)}
#ebtn{position:fixed;right:24px;bottom:34px;width:84px;height:84px;border-radius:50%;background:var(--green);border:4px solid #fff;color:#fff;font-family:var(--f);font-size:30px;display:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#ebtn.act{background:var(--orange)}
#rbtn{position:fixed;right:116px;bottom:30px;width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--line);color:var(--ink);font-family:var(--f);font-size:14px;display:none}
.touch #joy,.touch #ebtn,.touch #rbtn{display:block}.touch #hint,.touch #prompt{bottom:150px}.touch #strip{bottom:170px}.touch #travel{bottom:160px}
#loading>div:first-of-type{font-family:'Paperlogy',var(--f);font-weight:800}#loading{position:fixed;inset:0;background:#FFF1CF;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:20px;transition:opacity .6s}
#loading img{height:150px;animation:hop 1s infinite}
@keyframes hop{50%{transform:translateY(-16px)}}
#loading .lb{width:220px;height:12px;border-radius:7px;background:#EBDDB8;overflow:hidden}#loading .lb i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
@media (max-width:900px){
 #gauge{left:6px;right:6px;width:auto;transform:none;top:6px;padding:2px 12px 4px;border-radius:14px;display:flex;align-items:center;gap:10px}
 #gauge .t{font-size:12.5px;white-space:nowrap;flex:0 0 auto}#gauge .t b{font-size:13.5px}
 #gauge .bar{flex:1;margin:0;height:6px}#gauge .s{display:none}
 #mission{top:46px;left:6px;width:min(300px,56vw);padding:7px 10px 9px}#mission h3{font-size:14px}#mission .row{font-size:11.5px}
 #stats{top:46px;right:6px;min-width:0;padding:6px 8px}#stats .g{font-size:13px}.chip{font-size:12px;padding:0 6px}
 #minimap{top:190px}
 #zone{top:44px}
}
}
</style>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="mission" class="panel"></div>
<div id="gauge" class="panel"></div>
<div id="stats" class="panel"></div>
<div id="minimap" class="panel"><canvas id="mm" width="460" height="300"></canvas><div class="n">길 안내 전용 · 이동은 걸어서</div></div>
<div id="zone"></div><div id="prompt" class="panel"></div>
<div id="strip" class="panel"></div>
<div id="travel" class="panel"></div>
<div id="toast"></div>
<div id="hint">WASD/방향키 이동 · Shift 달리기 · 드래그 시점 · E 상호작용 · M 길 안내</div>

<div id="reward"><div class="box panel"><img id="rwImg" src="../assets_promy/promy_cheer.png" alt="프로미"><h2>미션 완료!</h2><div class="mn" id="rwMn"></div><div class="chips" id="rwChips"></div><div class="say" id="rwSay"></div><div class="nx" id="rwNx"></div><button class="btn go" id="rwOk">다음으로</button></div></div>

<div class="over" id="pPanel"><div class="box panel">
 <div class="promy-h"><img src="../assets_promy/promy_guide.png" alt="프로미"><div><h2>내 약속 한 줄</h2><div class="sub">닉네임과 약속을 적으면 수첩 첫 장이 채워져요.</div></div></div>
 <label>내 모습 고르기</label><div class="chs" id="pAv"></div>
 <label>닉네임</label><input type="text" id="pNick" maxlength="8" placeholder="예: 달빛고래">
 <label>어떤 약속일까요?</label><div class="chs" id="pAxis"></div>
 <label>누구와 함께?</label><div class="chs" id="pWith"></div>
 <label>약속 문장 (예시를 눌러 보세요)</label><div class="chs" id="pEx"></div>
 <input type="text" id="pText" maxlength="30" placeholder="~하기" style="margin-top:6px">
 <div class="prev" id="pPrev"></div>
 <div style="text-align:right;margin-top:10px"><button class="btn go" id="pOk">약속 정하기</button></div>
</div></div>

<div class="over" id="nPanel"><div class="box panel">
 <button class="btn x" id="nClose">닫기</button><h2>약속 수첩</h2><div id="nBody"></div>
</div></div>

<div id="joy"><i></i></div><button id="ebtn">E</button><button id="rbtn">달리기</button>
<div id="loading"><img src="../assets_promy/promy_guide.png" alt=""><div>프로미 광장을 열고 있어요…</div><div class="lb"><i id="lbi"></i></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {setupLook} from '../assets_3d_env/look.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============ 유틸 ============ */
const $=id=>document.getElementById(id);
const DEBUG=location.hash.includes('debug');
const MOBILE=matchMedia('(pointer:coarse)').matches||innerWidth<700;
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0)?a:b};
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const FONTT='"Paperlogy",'+FONT;
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 저장 상태 (세 맵 공용 키) ============ */
const KEY='promyWorld.v2';
const readSave=()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&typeof o==='object'?o:{}}catch(e){return{}}};
const sv=DEBUG?{}:readSave();
const pz=(sv.plaza&&typeof sv.plaza==='object')?sv.plaza:{};
const NICKS=['새싹손님','도란도란','보송이','다람이','나무늘보','포근이'];
const S={
  nick:typeof sv.nick==='string'?sv.nick:'',
  promise:typeof sv.promise==='string'?sv.promise:(sv.promise&&sv.promise.text)||'',
  with:typeof sv.with==='string'?sv.with:'',axis:typeof sv.axis==='string'?sv.axis:'',
  stamps:+sv.stamps||0,lamps:+sv.lamps||0,warmth:+sv.warmth||0,grade:'새싹',
  m:+pz.m||0,p:+pz.p||0,acts:+pz.acts||0,ally:Array.isArray(pz.ally)?pz.ally:[],stampDay:pz.stampDay||'',
  knots:+pz.knots||0,note:pz.note||null,cheered:Array.isArray(pz.cheered)?pz.cheered:[],recv:+pz.recv||0,fire:+pz.fire||0,ptext:pz.ptext||'',avatar:+pz.avatar||0
};
S.grade=gradeOf(S.stamps);
function gradeOf(n){return n>=15?'길잡이':n>=8?'지킴이':n>=3?'동행':'새싹'}
function persist(){
  if(DEBUG)return;
  try{const cur=readSave();
    Object.assign(cur,{nick:S.nick,promise:S.promise,with:S.with,axis:S.axis,stamps:S.stamps,lamps:S.lamps,warmth:S.warmth,grade:S.grade});
    let v=cur.visited;if(Array.isArray(v)){if(!v.includes('plaza'))v.push('plaza')}else if(v&&typeof v==='object'){v.plaza=true}else cur.visited=['plaza'];
    cur.plaza={m:S.m,p:S.p,acts:S.acts,ally:S.ally,stampDay:S.stampDay,knots:S.knots,note:S.note,cheered:S.cheered,recv:S.recv,fire:S.fire,ptext:S.ptext,avatar:S.avatar};
    localStorage.setItem(KEY,JSON.stringify(cur));
  }catch(e){}
}

/* ============ 렌더러·씬 ============ */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.5:2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1500);
const look=setupLook(THREE,scene,renderer,{preset:'day'});
const GRAD=(()=>{const t=new THREE.DataTexture(new Uint8Array([150,196,228,246]),4,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const toon=(color,o={})=>new THREE.MeshToonMaterial({color,gradientMap:GRAD,...o});
const GEO={sph:new THREE.SphereGeometry(1,18,14),cyl:new THREE.CylinderGeometry(1,1,1,20),box:new THREE.BoxGeometry(1,1,1),cone:new THREE.ConeGeometry(1,1,20),

function showStrip(html,x,z,r){strip.innerHTML=html;strip.classList.add('on');stripOwner={x,z,r}}
function closeStrip(){strip.classList.remove('on');stripOwner=null}
strip.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='close')closeStrip();
  else if(a==='cheer')cheerNote(+b.dataset.i);
  else if(a==='post')postNote();
  else if(a==='greet'||a==='support')greetNpc(NPCS[+b.dataset.n],a);
  else if(a==='ally')makeAlly(NPCS[+b.dataset.n]);
  else if(a==='chat')chatNpc(NPCS[+b.dataset.n]);
  else if(a==='stand')standUp()});
/* 게시판 */
function openBoard(){
  const bx=player.root.position.x,cw=BOARD.w/BOARD.cols,list=[];
  NOTES.forEach((n,i)=>{if(!n)return;const col=i%BOARD.cols,row=Math.floor(i/BOARD.cols);list.push({i,n,d:Math.abs(POS.board.x+(col-2.5)*cw-bx)+row*.35})});
  list.sort((a,b)=>a.d-b.d);const four=list.slice(0,4);
  const cards=four.map(({i,n})=>{const mine=n.mine,done=n.cheeredByMe;return`<div class="card paper"><div>“${esc(noteText(n))}”</div><div class="who">${esc(n.nick)} · ♥ ${n.hearts+(done?1:0)}</div><button class="btn pk" data-a="cheer" data-i="${i}" ${mine||done?'disabled':''}>${mine?'내 쪽지':done?'응원함 ♥':'응원'}</button></div>`}).join('');
  const hasNote=!!NOTES[17];
  showStrip(`<div class="hd"><span>프로미: “가까운 쪽지를 읽어 드릴게요. 마음에 들면 응원을 보내 주세요.”</span></div><div class="cards">${cards}</div><div class="ft">${hasNote?'<span style="font-size:13px;color:#8a7352;align-self:center">내 약속 쪽지가 게시판에 붙어 있어요</span>':`<button class="btn go" data-a="post" ${S.promise?'':'disabled'}>${S.promise?'내 약속 쪽지 붙이기':'먼저 약속을 정해 주세요'}</button>`}<button class="btn" data-a="close">닫기</button></div>`,POS.board.x,POS.board.z,8)}
function cheerNote(i){const n=NOTES[i];if(!n||n.cheeredByMe||n.mine)return;n.cheeredByMe=true;S.cheered.push(i);drawBoard();
  S.warmth+=1;persist();renderStats('warmth');act();player.emote('cheer',1.3);
  bubble(player,'응원해요!',2,{});toast(`${esc(n.nick)} 님의 약속에 하트 도장을 찍었어요 · 약속 온도 +1`,2400);
  progress('F2');progress('D2');openBoard()}
function postNote(){if(NOTES[17]||!S.promise)return;const t=S.ptext||(S.promise.split('함께, ')[1]||S.promise);NOTES[17]={nick:S.nick,w:S.with||'나',t,hearts:0,mine:true};S.note=true;drawBoard();persist();act();toast('내 약속 쪽지가 게시판에 붙었어요',2600,'promy_lantern');openBoard();
  setTimeout(()=>{const n=NOTES[17];if(!n)return;n.hearts++;n.fromNpc=true;drawBoard();S.recv++;S.warmth+=2;cheerNearestPromy();persist();renderStats('warmth');const g=NPCS[2]||NPCS[0];toast(`${g.nick} 님이 내 약속에 응원을 보냈어요 · 약속 온도 +2`,3200);bubble(g,'이 약속 응원해요!',3)},9000)}
/* 느티나무 */
let knotCool=0;
function tieKnot(){if(knotCool>0)return;knotCool=2.5;TREE.hang(S.nick||'나',true);S.knots++;player.emote('knot',1.7);bubble(player,'매듭을 묶었어요',2.2);persist();act();TREE.bump=.6;toast('느티나무 가지에 내 매듭이 걸렸어요 · 닉네임이 붙어 남아요',2800);progress('F3')}
/* 수첩 확인소 */
function stampToday(){const day=new Date().toDateString();player.emote('stamp',1.6);
  if(S.stampDay===day&&!DEBUG){toast('오늘 도장은 이미 찍었어요. 내일 또 만나요',2600,'promy_guide');progress('D1');return}
  S.stampDay=day;S.lamps+=1;lightMyLamps();const L=LAMPS.find(l=>l.mine&&l.pulse===0);if(L)L.pulse=0;persist();renderStats('lamp');act();

/* 초대 우체통 */
let mailCool=0;
function sendInvite(){if(mailCool>0)return;mailCool=4;player.emote('stamp',1.4);toast('초대장을 보냈어요 (시안) · 받은 분이 들어오면 약속 온도 +10',3600,'promy_letter');persist();act();progress('D4')}
/* 모닥불 */
const FIRELOGS=[];
function addFirewood(){if(fireCool>0)return;fireCool=2.5;S.fire++;const a=rnd(0,6.28),lg=M(FIRE.g,GEO.cyl,'#8A5A34',[Math.cos(a)*.5,.25+FIRELOGS.length*.04,Math.sin(a)*.5],[.13,.55,.13],[Math.PI/2,a,0]);pop(lg,0,.5);FIRELOGS.push(lg);FIRE.big=1;
  player.emote('stamp',1.2);bubble(player,'장작 하나 더!',2);persist();act();toast('장작을 놓았어요. 모닥불이 조금 더 커졌어요',2400);progress('D3')}
let fireCool=0;
/* 앉기 */
function sitOn(seat){if(seat.occ){toast('이미 앉은 분이 있어요',1600);return}
  player.sit=seat;seat.playerSit=true;player.setWalk(false);player.root.position.set(seat.x,heightAt(seat.x,seat.z)+seat.y-player.sitDrop,seat.z);player.yaw=seat.yaw;player.root.rotation.y=seat.yaw;
  let nb=null,bd=4.6;for(const n of NPCS){if(n.c.sit&&n.c.sit!==seat){const d=Math.hypot(n.x-seat.x,n.z-seat.z);if(d<bd){bd=d;nb=n}}}
  seatNb=nb;
  if(nb){const i=NPCS.indexOf(nb);showStrip(`<div class="hd"><span>${esc(nb.nick)} 님 옆에 앉았어요 · “${esc(sentence(nb.promise.includes('전화')?'가족':'친구',nb.promise))}”</span></div><div class="ft" style="justify-content:flex-start"><button class="btn" data-a="greet" data-n="${i}">인사하기</button><button class="btn" data-a="chat" data-n="${i}">같은 약속이네요</button><button class="btn go" data-a="ally" data-n="${i}" ${nb.ally?'disabled':''}>${nb.ally?'동맹이에요':'약속 동맹 맺기 (+5)'}</button><button class="btn" data-a="stand">일어나기</button></div>`,seat.x,seat.z,7);bubble(nb,'안녕하세요! 같이 앉아요',3)}
  else showStrip(`<div class="hd"><span>${seat.type==='log'?'모닥불이 따뜻해요. 옆자리가 비었네요. 잠시 앉아 있어도 좋아요.':'잠깐 앉아서 광장을 구경해 봐요.'}</span><button class="btn" data-a="stand">일어나기</button></div>`,seat.x,seat.z,7)}
let seatNb=null;
function standUp(){const s=player.sit;if(!s)return;s.playerSit=false;player.sit=null;player.root.position.x=s.x+Math.sin(s.yaw)*.9;player.root.position.z=s.z+Math.cos(s.yaw)*.9;player.root.position.y=heightAt(player.root.position.x,player.root.position.z);closeStrip()}
function chatNpc(n){bubble(player,'같은 약속이네요!',2.4);bubble(n,pick(['맞아요! 같이 지켜요','우리 약속 쌓는 중이에요']),3)}
function makeAlly(n){if(n.ally)return;n.ally=true;S.ally.push(n.nick);S.warmth+=5;persist();drawRank();renderStats('warmth');act();player.emote('cheer',1.6);n.c.emote('cheer',1.6);bubble(n,'좋아요, 우리 약속 동맹!',3.2);toast(`${esc(n.nick)} 님과 약속 동맹을 맺었어요 · 약속 온도 +5`,3200,'promy_cheer');
  const i=NPCS.indexOf(n);const b=strip.querySelector('[data-a=ally]');if(b){b.disabled=true;b.textContent='동맹이에요'}}
/* 방문객 인사 */
function openGreet(n){const i=NPCS.indexOf(n);n.faceT=3;showStrip(`<div class="hd"><span><b>${esc(n.nick)}</b> 님 · “${esc(n.promise)}”</span></div><div class="ft" style="justify-content:flex-start"><button class="btn" data-a="greet" data-n="${i}">인사하기</button><button class="btn pk" data-a="support" data-n="${i}">응원하기</button><button class="btn" data-a="close">닫기</button></div>`,n.x,n.z,6)}
function greetNpc(n,kind){const first=n.cool<=0;player.emote(kind==='support'?'cheer':'wave',1.5);n.faceT=3;
  const say=kind==='support'?pick(['고마워요! 힘이 나요','응원 받았어요!']):pick(['반가워요, '+(S.nick||'새 친구')+' 님!','오늘도 약속 지켰어요?']);
  setTimeout(()=>{n.c.emote(kind==='support'?'cheer':'wave',1.5);bubble(n,say,3)},350);
  if(first){n.cool=25;S.warmth+=1;persist();renderStats('warmth');act();toast(`${esc(n.nick)} 님과 ${kind==='support'?'응원을 주고받았어요':'인사했어요'} · 약속 온도 +1`,2200)}else toast('조금 뒤에 또 인사해 봐요',1400)}

];

function readRank(){drawRank();bubble(P.tree,'순위는 없어요. 동맹과 동네가 함께 쌓은 수를 읽어 드릴게요.',5,{type:true,promy:true});toast('동맹 · 지역별 실천 수 (시안). 개인 순위는 없어요',3200,'promy_cheer')}
let curInt=null;
function findInt(){
  const px=player.root.position.x,pzz=player.root.position.z;let best=null,bs=9;
  if(player.sit){return{label:()=>'일어나기',run:standUp}}
  const consider=(o,x,z,r,bias=0)=>{const d=Math.hypot(px-x,pzz-z);if(d<r){const s=d/r+bias;if(s<bs){bs=s;best=o}}};
  for(const it of INTS){if(it.seat&&(it.seat.occ||it.seat.playerSit))continue;consider(it,it.x,it.z,it.r)}
  for(const c of PROMIES)consider({label:()=>'프로미와 이야기하기',run:()=>talkPromy(c)},c.root.position.x,c.root.position.z,4.6);
  for(const n of NPCS)if(n.state!=='walk'||true)consider({label:()=>`${n.nick} 님에게 인사·응원`,run:()=>openGreet(n)},n.x,n.z,2.7,.45);
  return best}

const EVT={on:false,t:0,next:DEBUG?30:45,joined:false,el:null};
function startEvent(){if(EVT.on)return;EVT.on=true;sndBell();EVT.t=34;EVT.joined=false;
  EVT.el=toast('프로미: 곧 모닥불 모임이 열려요! 모임 마당으로 가 볼까요? · 합류하면 약속 온도 +5',0,'promy_cheer');bubble(P.arch,'모닥불 모임이 시작돼요! 모임 마당으로 모여요!',5,{type:true,promy:true});
  const sp=spotsAround(POS.fire.x,POS.fire.z,5.6,NPCS.length,.3);

function endEvent(){EVT.on=false;EVT.next=90;if(EVT.el){EVT.el.remove();EVT.el=null}NPCS.forEach((n,i)=>{n.evt=false;setTimeout(()=>{if(!n.evt)n.next()},i*350)});toast('모닥불 모임이 끝났어요. 숯불은 다음 날까지 남아요',2600)}
function eventUpdate(dt){
  if(!EVT.on){EVT.next-=dt;if(EVT.next<=0)startEvent();return}
  EVT.t-=dt;const d=Math.hypot(player.root.position.x-POS.fire.x,player.root.position.z-POS.fire.z);
  if(!EVT.joined&&d<7.5){EVT.joined=true;S.warmth+=5;persist();renderStats('warmth');act();player.emote('cheer',1.8);bubble(player,'함께해요!',2.4);toast('모닥불 모임에 합류했어요 · 약속 온도 +5',3200,'promy_cheer')}
  if(EVT.t<=0)endEvent()}

let mapOn=false;const mm=$('mm'),mg=mm.getContext('2d');
function toggleMap(){mapOn=!mapOn;$('minimap').classList.toggle('on',mapOn)}
const MX0=-60,MZ0=-30,MS=3.7;const mp=(x,z)=>[(x-MX0)*MS,(z-MZ0)*MS];
function drawMap(){
  mg.fillStyle='#9ADB78';mg.fillRect(0,0,460,300);
  mg.strokeStyle='#F3E3BE';mg.lineWidth=9;mg.lineCap='round';mg.lineJoin='round';
  for(const r of Object.values(ROADS)){mg.beginPath();r.forEach((p,i)=>{const[a,b]=mp(p[0],p[1]);i?mg.lineTo(a,b):mg.moveTo(a,b)});mg.stroke()}
  let [a,b]=mp(PL.x,PL.z);mg.fillStyle='#F3E3BE';mg.beginPath();mg.arc(a,b,PL.r*MS,0,7);mg.fill();
  [a,b]=mp(IS.x,IS.z);mg.strokeStyle='#7FD3E8';mg.lineWidth=(IS.r2-IS.r1+1)*MS;mg.beginPath();mg.arc(a,b,(IS.r1+IS.r2)/2*MS,0,7);mg.stroke();mg.fillStyle='#8FD16A';mg.beginPath();mg.arc(a,b,IS.r1*MS,0,7);mg.fill();mg.fillStyle='#fff';mg.beginPath();mg.arc(a,b,5*MS,0,7);mg.fill();
  mg.strokeStyle='#C99A63';mg.lineWidth=7;for(const br of BR){mg.beginPath();mg.moveTo(...mp(IS.x+br.c*IS.r1,IS.z+br.s*IS.r1));mg.lineTo(...mp(IS.x+br.c*IS.r2,IS.z+br.s*IS.r2));mg.stroke()}
  const dot=(x,z,col,t,r=7)=>{const[a,b]=mp(x,z);mg.fillStyle=col;mg.beginPath();mg.arc(a,b,r,0,7);mg.fill();if(t){mg.fillStyle='#5A4636';mg.font='bold 17px sans-serif';mg.textAlign='center';mg.strokeStyle='rgba(255,255,255,.9)';mg.lineWidth=4;mg.strokeText(t,a,b-11);mg.fillText(t,a,b-11)}};
  dot(POS.arch.x,POS.arch.z,'#aaa','입구');dot(POS.tree.x,POS.tree.z,'#5DB36B','느티나무');dot(POS.board.x,POS.board.z,'#D9A66B','게시판');dot(POS.hall.x,POS.hall.z+1,'#FFD84A','체험관',9);dot(GATE.x,GATE.z,'#fff','약속산 문');dot(POS.fire.x,POS.fire.z,'#F2994A','모임 마당');dot(POS.gaz.x,POS.gaz.z,'#E58A6A','수첩');dot(POS.mail.x,POS.mail.z,'#E8636B','우체통');dot(POS.rank.x,POS.rank.z,'#D9A66B','기록판');
  for(const L of LB){const c=L.toWorld(0,0);dot(c.x,c.z,L.open?'#F8BDD1':'#B8B8C0',L.id.toUpperCase()+(L.open?'':' 잠김'),8)}
  const m=MIS[S.m];if(m&&m.tg){const t=m.tg(),[x,y]=mp(t.x,t.z),k=(performance.now()/500)%1;mg.strokeStyle='#FFB22E';mg.lineWidth=4;mg.beginPath();mg.arc(x,y,8+k*14,0,7);mg.stroke();mg.fillStyle='#FFB22E';mg.beginPath();mg.arc(x,y,6,0,7);mg.fill()}
  [a,b]=mp(player.root.position.x,player.root.position.z);mg.save();mg.translate(a,b);mg.rotate(-player.yaw+Math.PI);mg.fillStyle='#E8636B';mg.strokeStyle='#fff';mg.lineWidth=3;mg.beginPath();mg.moveTo(0,-11);mg.lineTo(8,8);mg.lineTo(-8,8);mg.closePath();mg.fill();mg.stroke();mg.restore()}

const keys={};let joy={x:0,y:0},run=false,camYaw=2.05,camPitch=.24,camDist=9.5;

  if(k==='p'){toggleSound();return}keys[k]=true;if(k==='shift')run=true;if(k==='e')interact();if(k==='m')toggleMap();if(k==='n')openNotebook()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='shift')run=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;run=false});
let drag=null;

    const lfo=c.createOscillator();lfo.frequency.value=.12;const lg=c.createGain();lg.gain.value=.04;lfo.connect(lg);lg.connect(wg.gain);lfo.start()}catch(e){SND.ctx=null}}
function sndTone(f,dur,vol=.3,delay=0,type='sine',f2){const c=SND.ctx;if(!c||!SND.on)return;try{const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function sndNoise(dur,vol,freq,type='lowpass',delay=0){const c=SND.ctx;if(!c||!SND.on||!SND.noise)return;try{const t=c.currentTime+delay,s=c.createBufferSource();s.buffer=SND.noise;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(SND.master);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)}catch(e){}}
const sndPop=()=>sndTone(520,.14,.3,0,'sine',900);
const sndStep=()=>sndNoise(.07,.35,500+Math.random()*150);
const sndChime=()=>{[523.25,659.25,783.99].forEach((f,i)=>sndTone(f,.45,.26,i*.13,'triangle'))};
const sndBell=()=>{sndTone(660,1.6,.25,0,'sine');sndTone(1320,1.0,.08,0,'sine')};
function sndBird(){const f=2300+Math.random()*900,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)sndTone(f*(1+i*.06),.09,.06,i*.11,'sine',f*1.25)}
function sndBtnUpdate(){const b=$('bSnd');if(!b)return;b.textContent=SND.on?'🔊':'🔇';b.setAttribute('aria-label',SND.on?'소리 끄기':'소리 켜기');b.title=(SND.on?'소리 끄기':'소리 켜기')+' (P)'}
function toggleSound(){sndInit();SND.on=!SND.on;try{localStorage.setItem('yaksok-sound',SND.on?'on':'off')}catch(e){}
  if(SND.master&&SND.ctx){try{SND.master.gain.setTargetAtTime(SND.on?.25:0,SND.ctx.currentTime,.05)}catch(e){}}sndBtnUpdate();if(SND.on)sndPop()}
function sndUpdate(dt,pp){
  if(!SND.ctx||!SND.on)return;
  SND.birdT-=dt;if(SND.birdT<=0){SND.birdT=7+Math.random()*9;sndBird()}
  const moved=SND.lastPos?Math.hypot(pp.x-SND.lastPos.x,pp.z-SND.lastPos.z):0;SND.lastPos={x:pp.x,z:pp.z};
  if(!player.sit&&moved>0){SND.stepAcc+=moved;if(SND.stepAcc>1.05){SND.stepAcc=0;sndStep()}}else if(moved===0)SND.stepAcc=0;
  const d=Math.hypot(pp.x-POS.fire.x,pp.z-POS.fire.z),k=clamp(1-d/16,0,1);SND.crackT-=dt;
  if(k>0&&SND.crackT<=0){SND.crackT=.05+Math.random()*.3;sndNoise(.03+Math.random()*.03,.5*k*k+.03*k,2500+Math.random()*2500,'highpass')}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>sndInit(),{once:false,passive:true}));

/* ============ 시작 지점 ?at=<키> (허브에서 진입) ============ */
function applyStartAt(){
  try{
    const key=new URLSearchParams(location.search).get('at');
    const idx={tree:0,board:1,rank:2,gaz:3,mail:4,fire:5}[key];
    if(idx===undefined)return;
    const it=INTS[idx],cx=-30,cz=20;/* 광장 중심 쪽으로 */
    const base=Math.atan2(cz-it.z,cx-it.x);
    let best=null;
    for(const rf of [.6,.75,.9,1.05]){for(let k=0;k<24&&!best;k++){
      const a=base+(k%2?1:-1)*Math.ceil(k/2)*(Math.PI/12);
      const p={x:it.x+Math.cos(a)*it.r*rf,z:it.z+Math.sin(a)*it.r*rf},q={x:p.x,z:p.z};collide(q,.6);
      if(Math.hypot(q.x-p.x,q.z-p.z)<.01&&Math.abs(heightAt(p.x,p.z)-heightAt(it.x,it.z))<.6){best=p}}
      if(best)break}
    if(!best)return;
    const pp=player.root.position;pp.set(best.x,heightAt(best.x,best.z),best.z);
    player.yaw=Math.atan2(it.x-best.x,it.z-best.z);player.root.rotation.y=player.yaw;
    camYaw=player.yaw;camTarget.set(best.x,pp.y+1.55,best.z);
  }catch(e){console.warn('start-at',e)}
}
